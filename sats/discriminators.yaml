# SATS adult clinical signs ("discriminators").
#
# Sign names and priorities: SATS Training Manual 2012 (Western Cape Government Health),
# section 3 "Adult Clinical Signs": 3.1 Emergency signs (p.12), 3.2 Very urgent signs (p.12),
# 3.3 Urgent signs (p.13); also the Adult SATS Chart, p.9 Figure 4. Definitions quoted in `note`.
# `verified: true` = the sign and its priority were checked against those pages.
#
# The `phrases` used to recognise each sign in a free-text note (English synonyms, OPD
# abbreviations, Nigerian Pidgin) are NOT from the manual. They are Klaudesk's own draft
# (phrases_source below) and need review by Nigerian triage nurses.
#
# Matching: lowercase, hyphens -> spaces, whole words only. A phrase preceded in the same clause by
# a negation cue ("no", "denies", ...) counts as negated and does not raise the priority. Entries
# list `phrases` (any one matches) or `all_of` (every named phrase set must match).

phrases_source: { document: Klaudesk phrase lists (draft), reviewed_by_nurses: false }

negation_cues: ["no", "not", "denies", "denied", "without", "nil", "never", "negative for"]

_s12e: &p12e { document: SATS Training Manual, edition: "2012 (Western Cape Government Health)", location: "p.12, 3.1 Emergency signs" }
_s12v: &p12v { document: SATS Training Manual, edition: "2012 (Western Cape Government Health)", location: "p.12, 3.2 Very urgent signs" }
_s13u: &p13u { document: SATS Training Manual, edition: "2012 (Western Cape Government Health)", location: "p.13, 3.3 Urgent signs" }

phrase_sets:
  pregnancy: ["pregnant", "pregnancy", "weeks gestation", "get belle", "carry belle", "carrying belle", "antenatal", "anc"]
  abdominal_pain: ["abdominal pain", "abdo pain", "lower abdominal pain", "stomach pain", "belle pain", "belle dey pain", "belle dey pain me"]
  abdominal_trauma: ["abdominal trauma", "abdominal injury", "blow to the abdomen", "kicked in the abdomen", "kicked in the belly", "hit on the belly", "belle injury"]
  trauma: ["trauma", "injury", "injured", "fell", "fall", "rta", "road traffic accident", "accident", "beaten", "assaulted", "hit by"]
  pv_bleed: ["pv bleeding", "pv bleed", "vaginal bleeding", "bleeding per vagina", "blood dey come from her private part"]

discriminators:
  # ---------------------------------------------------------------- EMERGENCY (RED), p.12
  - id: disc.red.airway
    name: Obstructed airway – not breathing
    priority: RED
    phrases: ["obstructed airway", "airway obstructed", "airway obstruction", "choking", "stridor", "not breathing", "stopped breathing", "apnoea", "apnea", "no dey breathe"]
    source: *p12e
    verified: true
  - id: disc.red.seizure_current
    name: Seizures – current
    priority: RED
    phrases: ["seizing", "actively seizing", "convulsing", "still convulsing", "fitting", "actively fitting", "dey convulse", "dey jerk"]
    source: *p12e
    verified: true
  - id: disc.red.burn_face_inhalation
    name: Burn – facial / inhalation
    priority: RED
    note: "p.12: airway potentially exposed to heat, e.g. trapped in a house fire, hot water burn to face, steam or chemical inhalation; singed facial hair, soot around nose/mouth."
    phrases: ["facial burn", "burn to face", "burns to face", "burn to the face", "inhalation burn", "smoke inhalation", "singed eyebrows", "singed facial hair", "soot around nose", "soot around mouth", "trapped in a house fire"]
    source: *p12e
    verified: true
  - id: disc.red.hypoglycaemia
    name: Hypoglycaemia – glucose less than 3 mmol/L
    priority: RED
    phrases: ["hypoglycaemia", "hypoglycemia", "hypoglycaemic", "hypoglycemic", "low sugar", "sugar low", "sugar don drop"]
    source: *p12e
    verified: true
  - id: disc.red.cardiac_arrest
    name: Cardiac arrest
    priority: RED
    phrases: ["cardiac arrest", "no pulse", "pulseless"]
    source: *p12e
    verified: true

