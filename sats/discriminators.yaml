# SATS adult emergency signs ("discriminators") — DRAFT, unverified.
#
# Matching is deterministic keyword/phrase matching on a normalised note
# (lowercase, hyphens -> spaces, whole-word matches). A phrase preceded in
# the same clause by a negation cue ("no", "denies", ...) is reported as
# negated and does not count towards priority.
#
# Entries either list `phrases` (any one matches) or `all_of` (every named
# phrase set must match). Nigerian Pidgin phrases are drafts and need review
# by a Pidgin-speaking nurse.

negation_cues: ["no", "not", "denies", "denied", "without", "nil", "never", "negative for"]

phrase_sets:
  pregnancy: ["pregnant", "pregnancy", "weeks gestation", "get belle", "carrying belle", "antenatal", "anc"]
  abdominal_pain: ["abdominal pain", "abdo pain", "lower abdominal pain", "stomach pain", "belle pain", "belle dey pain", "belle dey pain me", "pv bleeding", "vaginal bleeding"]
  trauma: ["fell", "fall", "rta", "road traffic accident", "accident", "beaten", "assaulted", "hit by"]

