[project]
name = "khelp-api"
version = "0.1.0"
description = "Klaudesk API and agent runner"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "khelp-scoring",
    "khelp-db",
    "khelp-triage-tools",
    "strands-agents[ollama,openai]>=1.59,<2",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
khelp-agent = "khelp_api.agent.cli:main"
khelp-api = "khelp_api.main:run"
khelp-seed = "khelp_api.seed:main"

[tool.uv.sources]
khelp-scoring = { workspace = true }
khelp-db = { workspace = true }
khelp-triage-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khelp_api"]
