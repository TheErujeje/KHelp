[project]
name = "khelp-api"
version = "0.1.0"
description = "KHelp API and agent runner"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "khelp-scoring",
    "khelp-db",
    "khelp-triage-tools",
    "strands-agents[ollama]>=1.59,<2",
]

[project.scripts]
khelp-agent = "khelp_api.agent.cli:main"

[tool.uv.sources]
khelp-scoring = { workspace = true }
khelp-db = { workspace = true }
khelp-triage-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khelp_api"]
