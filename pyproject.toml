[project]
name = "khelp"
version = "0.1.0"
description = "KHelp: a cited SATS triage-priority assistant for outpatient triage desks"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["khelp-scoring"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/scoring"]

[tool.uv.sources]
khelp-scoring = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["packages/scoring/tests"]
