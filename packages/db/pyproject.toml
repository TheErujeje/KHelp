[project]
name = "khelp-db"
version = "0.1.0"
description = "KHelp Postgres models, sessions and Alembic migrations"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["sqlalchemy>=2.0,<2.2", "psycopg[binary]>=3.2", "alembic>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khelp_db"]
