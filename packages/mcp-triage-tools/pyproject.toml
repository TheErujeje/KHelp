[project]
name = "khelp-triage-tools"
version = "0.1.0"
description = "triage-tools MCP server: thin wrappers over khelp-scoring plus the proposal/re-check write paths"
requires-python = ">=3.11"
license = "Apache-2.0"
# mcp upper bound follows strands-agents' supported range
dependencies = ["khelp-scoring", "khelp-db", "mcp>=2.1,<2.2"]

[project.scripts]
khelp-triage-tools = "khelp_triage_tools.server:main"

[tool.uv.sources]
khelp-scoring = { workspace = true }
khelp-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khelp_triage_tools"]
