[project]
name = "khelp-scoring"
version = "0.1.0"
description = "Deterministic SATS adult TEWS, discriminator lookup and priority rules"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khelp_scoring"]
